<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Log In</title>
</head>
<body>
<form action="#" method="post">

    <div class="container">
        <label for="username"><b>Benutzername</b></label>
        <input id="username" type="text" placeholder="Benutzername" name="username" required>

        <label for="password"><b>Passwort</b></label>
        <input id="password" type="password" placeholder="Passwort" name="password" required>

        <button type="submit">Login</button>
    </div>

</form>
<br>
<div class="container" style="background-color:#f1f1f1">
    <button type="reset" class="cancel">Cancel</button>
</div>
</body>
</html>
