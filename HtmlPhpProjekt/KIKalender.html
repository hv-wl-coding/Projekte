<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Interaktiver Kalender mit Popup</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        .calendar-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day {
            aspect-ratio: 1;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .day:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .day.empty {
            background-color: transparent;
            border: none;
            cursor: default;
        }

        .day.empty:hover {
            background-color: transparent;
            transform: none;
            color: inherit;
        }

        /* Popup / Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .close-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
            font-weight: bold;
        }

        .close-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="topnav">
    <a href="Trainingsdaten.html">Trainingsdaten</a>
    <a href="GRIDKalender.html">GRID Kalender</a>
    <a href="PHPKalender.php">PHP Kalender</a>
    <a href="FinalKalender.php">Finaler Kalender</a>
    <a href="Auswertung.html">Auswertung</a>
    <a href="Impressum.html">Impressum</a>
</div>

<div class="calendar-container">
    <h2 id="month-year">Monat</h2>
    <div class="weekdays">
        <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
    </div>
    <div class="days-grid" id="days-grid">
        <!-- Tage werden per JavaScript eingefügt -->
    </div>
</div>

<!-- Das Popup (Modal) -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="modal-title">Datum</h3>
        <p id="modal-text">Hier kannst du Notizen oder Termine für diesen Tag eintragen.</p>
        <button class="close-btn" onclick="closeModal()">Schließen</button>
    </div>
</div>

<script>
    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    // Aktuelles Datum holen
    const date = new Date();
    const currentMonth = date.getMonth();
    const currentYear = date.getFullYear();

    document.getElementById("month-year").innerText = `${monthNames[currentMonth]} ${currentYear}`;

    // Tage des Monats berechnen
    const daysGrid = document.getElementById("days-grid");

    // Ersten Tag des Monats ermitteln (0 = Sonntag, 1 = Montag, ...)
    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
    // Anpassung, damit Montag (=1) der erste Wochentag ist (Sonntag wird 7)
    const startingSpace = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

    // Letzten Tag des Monats ermitteln
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

    // Leere Felder für Tage vor dem Monatsbeginn einfügen
    for (let i = 0; i < startingSpace; i++) {
        const emptyDiv = document.createElement("div");
        emptyDiv.classList.add("day", "empty");
        daysGrid.appendChild(emptyDiv);
    }

    // Tage des Monats generieren
    for (let day = 1; day <= totalDays; day++) {
        const dayDiv = document.createElement("div");
        dayDiv.classList.add("day");
        dayDiv.innerText = day;

        // Klick-Eingabe für das Popup
        dayDiv.addEventListener("click", () => {
            openModal(day, monthNames[currentMonth], currentYear);
        });

        daysGrid.appendChild(dayDiv);
    }

    // Popup Funktionen
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modal-title");
    const modalText = document.getElementById("modal-text");

    function openModal(day, month, year) {
        modalTitle.innerText = `${day}. ${month} ${year}`;
        modalText.innerText = `Du hast den ${day}. ${month} ${year} angeklickt. Perfekt für einen Adventskalender oder einen Terminplaner!`;
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    // Schließen, wenn man außerhalb des Popups klickt
    window.onclick = function(event) {
        if (event.target === modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
